services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: golden
      POSTGRES_PASSWORD: golden_dev_password
      POSTGRES_DB: golden_sys
    ports:
      - "5437:5432"
    volumes:
      - golden_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden -d golden_sys"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://golden:golden_dev_password@postgres:5432/golden_sys?schema=public
      AUTH_SECRET: replace-me
      ADMIN_NAME: School Administrator
      ADMIN_EMAIL: admin@goldenchild.example
      ADMIN_PASSWORD: replace-me
      SEED_DEMO: "0"
      STORAGE_DIR: storage/private
    volumes:
      - golden_files:/app/storage/private
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  golden_pg:
  golden_files:
